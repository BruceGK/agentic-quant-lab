name: Azure SEC recorder acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_acceptance:
        description: "Run one existing Azure job; does not enable scheduled recording"
        required: true
        type: boolean
        default: false
      command:
        description: "Only record can produce an ingestion completion event"
        required: true
        type: choice
        default: record
        options:
          - record
          - snapshot
          - reconcile
          - replay
          - verify-blob

permissions:
  contents: read

concurrency:
  group: aql-azure-recorder-writer
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.confirm_acceptance &&
      vars.AQL_ACCEPTANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ccc5a11c-86d7-40f1-b02c-58660a2582a7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check nonsecret OIDC configuration
        env:
          AQL_CLIENT_ID: ${{ vars.AQL_AZURE_CLIENT_ID }}
          AQL_TENANT_ID: ${{ vars.AQL_AZURE_TENANT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import uuid
          for key in ("AQL_CLIENT_ID", "AQL_TENANT_ID"):
              uuid.UUID(os.environ[key])
          PY
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AQL_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AQL_AZURE_TENANT_ID }}
          subscription-id: ccc5a11c-86d7-40f1-b02c-58660a2582a7
          enable-AzPSSession: false
      - name: Start and await the existing manual Azure job
        env:
          AQL_COMMAND: ${{ inputs.command }}
        run: python3 infra/azure/scripts/job.py --command "$AQL_COMMAND" --apply --wait
      - name: Describe the verification boundary
        if: always()
        run: |
          printf '%s\n' \
            '### Azure Phase-0 acceptance' \
            'Manual job only; no build, deployment, database password, or Blob data permission in GitHub.' \
            'Job Succeeded is not ingestion proof. Verify aql.recorder.completed, remote chain, database reconciliation, and actual alert delivery separately.' \
            'Scheduled recording and live execution remain disabled.' >> "$GITHUB_STEP_SUMMARY"
